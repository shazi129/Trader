<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>Diagnostic</title>
<style>
body{background:#0d1117;color:#c9d1d9;font-family:monospace;padding:20px;line-height:1.8}
.pass{color:#26a641}.fail{color:#e5534b}.info{color:#58a6ff}.warn{color:#d2991d}
</style>
</head>
<body>
<h2>EastMoney API 浏览器诊断</h2>
<pre id="log"></pre>

<script>
const log = document.getElementById('log');
function L(msg, cls='') {
    log.innerHTML += `<span class="${cls}">${msg}</span>\n`;
    console.log(msg);
}

// ===== 测试 1：普通 fetch（预期 CORS 错，但能确认网络通） =====
(async function test1() {
    L('\n--- 测试1: fetch() 直连 ---', 'info');
    try {
        const r = await fetch('https://push2.eastmoney.com/api/qt/stock/get?secid=116.00700&fields=f43,f57&ut=fa5fd1943c7b386f172d6893dbfba10b', { mode: 'cors' });
        L('✅ fetch 200 — 服务器正常 (' + r.status + ')', 'pass');
    } catch(e) {
        if (e.message.includes('Failed to fetch') || e.message.includes('NetworkError')) {
            L('❌ 网络断开 (无法建立连接)', 'fail');
        } else if (e.message.includes('CORS') || e.message.includes('cross-origin')) {
            L('⚠️ CORS 拒绝 (但服务器可达!)', 'warn');
        } else {
            L('❌ ' + e.message, 'fail');
        }
    }
})();

// ===== 测试 2：no-cors fetch（不读响应，只看能不能连上） =====
(async function test2() {
    L('\n--- 测试2: fetch() no-cors ---', 'info');
    try {
        const r = await fetch('https://push2.eastmoney.com/api/qt/stock/get?secid=116.00700&fields=f43,f57&ut=fa5fd1943c7b386f172d6893dbfba10b', { mode: 'no-cors' });
        L('✅ no-cors 成功 — 服务器可达 (type=' + r.type + ')', 'pass');
    } catch(e) {
        L('❌ no-cors 也失败: ' + e.message, 'fail');
    }
})();

// ===== 测试 3：JSONP 带 cb= （get 端点） =====
function test3() {
    L('\n--- 测试3: JSONP cb= (get 端点) ---', 'info');
    const script = document.createElement('script');
    window._diagCbGet = function(data) {
        L('✅ JSONP cb= 成功! keys: ' + Object.keys(data||{}).join(','), 'pass');
        script.remove();
    };
    script.onerror = function(e) {
        L('❌ JSONP cb= 失败 (onerror)', 'fail');
        script.remove();
    };
    script.src = 'https://push2.eastmoney.com/api/qt/stock/get?secid=116.00700&fields=f43,f57,f58&ut=fa5fd1943c7b386f172d6893dbfba10b&cb=_diagCbGet';
    document.head.appendChild(script);
}
setTimeout(test3, 1000);

// ===== 测试 4：JSONP 带 callback=  =====
function test4() {
    L('\n--- 测试4: JSONP callback= ---', 'info');
    const script = document.createElement('script');
    window._diagCallbackGet = function(data) {
        L('✅ JSONP callback= 成功!', 'pass');
        script.remove();
    };
    script.onerror = function(e) {
        L('❌ JSONP callback= 失败', 'fail');
        script.remove();
    };
    script.src = 'https://push2.eastmoney.com/api/qt/stock/get?secid=116.00700&fields=f43,f57&ut=fa5fd1943c7b386f172d6893dbfba10b&callback=_diagCallbackGet';
    document.head.appendChild(script);
}
setTimeout(test4, 2000);

// ===== 测试 5：trends2 端点（确认支持 cb=） =====
function test5() {
    L('\n--- 测试5: trends2 cb= (确认JSONP) ---', 'info');
    const script = document.createElement('script');
    window._diagCbTrends = function(data) {
        L('✅ trends2 JSONP 成功! rc=' + (data?data.rc:'?'), 'pass');
        script.remove();
    };
    script.onerror = function(e) {
        L('❌ trends2 JSONP 失败 — 服务器完全不可达', 'fail');
        script.remove();
    };
    script.src = 'https://push2.eastmoney.com/api/qt/stock/trends2/get?secid=116.00700&ndays=1&fields1=f1,f2&fields2=f51,f52,f53&ut=fa5fd1943c7b386f172d6893dbfba10b&cb=_diagCbTrends';
    document.head.appendChild(script);
}
setTimeout(test5, 3000);

// ===== 测试 6：其他 eastmoney 域名可达性 =====
(async function test6() {
    L('\n--- 测试6: 其他域名 fetch ---', 'info');
    const tests = [
        ['quote.eastmoney.com', 'https://quote.eastmoney.com/'],
        ['so.eastmoney.com', 'https://so.eastmoney.com/'],
        ['push2.eastmoney.com (root)', 'https://push2.eastmoney.com/'],
    ];
    for (const [name, url] of tests) {
        try {
            const r = await fetch(url, { mode: 'no-cors' });
            L(`  ${name}: ✅ (type=${r.type})`, 'pass');
        } catch(e) {
            L(`  ${name}: ❌ ${e.message.slice(0,60)}`, 'fail');
        }
    }
})();

// ===== 测试 7：已知可达的外部网站 =====
(async function test7() {
    L('\n--- 测试7: 外网可达性 ---', 'info');
    try {
        const r = await fetch('https://www.baidu.com', { mode: 'no-cors' });
        L('  baidu.com: ✅', 'pass');
    } catch(e) { L('  baidu.com: ❌', 'fail'); }
    try {
        const r = await fetch('https://httpbin.org/ip', { mode: 'cors' });
        const j = await r.json();
        L('  httpbin.org: ✅ IP=' + j.origin, 'pass');
    } catch(e) { L('  httpbin.org: ❌ ' + e.message.slice(0,60), 'fail'); }
})();
</script>
</body>
</html>
